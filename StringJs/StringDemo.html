    <script>
      let emailformat = ["@gmail.com"];

      let format = prompt("Enter Your gmail with Valid format");
      let result = emailformat.filter((emailformat) =>
        emailformat.toLowerCase().includes(format.toLowerCase()),
      );
      if (result.length !== 0) {
        console.log(result);
      } else {
        console.log("email format invalid");
      }
    </script>
