    <script>
      function calculateExperience(joiningDate, currentDate) {
        let years = currentDate.getFullYear() - joiningDate.getFullYear();

        let months = currentDate.getMonth() - joiningDate.getMonth();

        if (currentDate.getDate() < joiningDate.getDate()) {
          months--;
        }

        if (months < 0) {
          years--;
          months += 12;
        }

        return { years, months };
      }

      let joiningDatee = new Date(2021, 5, 15);
      let currentDate = new Date(2026, 10, 21);

      let experience = calculateExperience(joiningDatee, currentDate);

      console.log(experience);
      console.log(`${experience.years} years and ${experience.months} months`);
    </script>
