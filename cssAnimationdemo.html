<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .Box1 {
        width: 100px;
        height: 100px;
        background: red;

        animation: movingBox 5s infinite reverse;
        animation-delay: 5s;
        animation-play-state: 5;
      }
      @keyframes movingBox {
        0% {
          position: relative;
          top: 0;
          left: 0;
          transform: rotate(0deg);
        }
        25% {
          position: relative;
          top: 0;
          left: 750px;
          background: yellow;
          transform: rotate(90deg);
        }
        50% {
          position: relative;
          top: 350px;
          left: 750px;
          background: green;
          transform: rotate(180deg);
        }

        75% {
          position: relative;
          top: 350px;
          left: 0px;
          background: blue;
          transform: rotate(270deg);
        }
        100% {
          position: relative;
          top: 0px;
          left: 0px;
          background: pink;
          transform: rotate(360deg);
        }

        from {
          transform: translateX(0);
          position: relative;
          top: 0;
          left: 0;
        }
        to {
          transform: translateX(500px);
          position: relative;
          top: 100px;
          left: 560px;
        }
      }
      spinner square .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #bbb;
        border-radius: 50%;
        border-top: 5px solid black;

        animation: spin 0.5s infinite linear;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .div2 {
        display: flex;
        padding: 20px;
        margin-left: 20px;
      }

      .card {
        width: 250px;
        height: 350px;
        background: lightcoral;
        animation: zoom 1s infinite alternate;
      }

      @keyframes zoom {
        0% {
          transform: scale(1.1);
        }
        50% {
          transform: scale(0);
        }
        100% {
          transform: scale(1.1);
        }
      }

      /* image opacity effect */
      .img {
        width: 200px;
        height: 200px;
      }
      .img {
        animation: imageDemo 3s infinite;
      }
      @keyframes imageDemo {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* button hover effect  */
      .btn {
        padding: 12px 25px;
        background: rgb(214, 2, 2);
        color: white;
        border: none;
        border-radius: 5px;
        transition: transform 0.5s;
      }

      .btn:hover {
        animation: buttonPulse 0.5s;
      }
      @keyframes buttonPulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      .div1 {
        width: 300px;
        height: 350px;
        margin-left: 20px;
        padding: 20px;
        display: flex;
      }

      img {
        width: 150px;
        height: 200px;
      }

      .card1 {
        opacity: 0;
        animation: cardEntry 0.6s ease forwards;
      }

      .card1:nth-child(1) {
        animation-delay: 1s;
      }

      .card1:nth-child(2) {
        animation-delay: 2s;
      }
      .card1:nth-child(3) {
        animation-delay: 3s;
      }
      .card1:nth-child(4) {
        animation-delay: 4s;
      }
      .card1:nth-child(5) {
        animation-delay: 5s;
      }
      .card1:nth-child(6) {
        animation-delay: 6s;
      }

      @keyframes cardEntry {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  .card1

  <body>
    <div class="div2">
      <div class="spinner" style="margin-left: 20px"></div>

      <div class="spinner" style="margin-left: 20px"></div>

      <div class="spinner" style="margin-left: 20px"></div>

      <div class="spinner" style="margin-left: 20px"></div>

      <div class="spinner" style="margin-left: 20px"></div>
    </div>

    <hr />
    <div class="div1">
      <div class="card1" style="width: 100px; height: 90px; background: blue">
        card 1
      </div>
      <div class="card1" style="width: 100px; height: 90px; background: yellow">
        card 1
      </div>

      <div class="card1" style="width: 50px; height: 60px; background: red">
        card 1
      </div>

      <div class="card1" style="width: 50px; height: 60px; background: pink">
        card 1
      </div>

      <div class="card1" style="width: 50px; height: 60px; background: violet">
        card 1
      </div>
    </div>
    <hr />
    <button class="btn">Buy Now</button>
    <hr />
    <div class="img">
      <img src="./assets/me.jpeg" alt="image" />
    </div>
    <hr />

    <div class="card"></div>
    <hr />
    <div class="spinner"></div>

    <div class="Box1"></div>
  </body>
</html>
