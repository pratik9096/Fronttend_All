  <body>
    <script>
      var number = Number.parseInt(prompt("Enter the Number to Check  :"));

      if (number > 0) {
        console.log(`${number} Is A positive Number .`);
      } else if (number < 0) {
        console.log(`${number} IS A nEGATIVE number `);
      } else {
        console.log(`Number is Zero `);
      }
    </script>
