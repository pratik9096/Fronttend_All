<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body>
    <div rounded-lg p-3 mt-4>
      <div class="odd:bg-red-500 even:bg-green-300 p-4">Row 1</div>

      <div class="odd:bg-red-500 even:bg-green-300 p-4">Row 2</div>
      <div class="odd:bg-red-500 even:bg-green-300 p-4">Row 3</div>
      <div class="odd:bg-red-500 even:bg-green-300 p-4">Row 4</div>
      <div class="odd:bg-red-500 even:bg-green-300 p-4">Row 5</div>

      <div class="space-y-2">
        <p class="first:font-bold">First Item</p>

        <p>Second Item</p>
        <p class="last:text-blue-600">Last Item</p>
      </div>
    </div>

    <!--  focus With in which dev changes cover after click hover effect -->
    <div
      class="border border-grey-300 focus-within:border-red-500 rounded-lg p-3 mt-3"
    >
      <label for="email" class="block text-sm text-grey-600">Email</label>
      <input
        type="email"
        class="w-full outline-none mt-1"
        placeholder="Enter Email "
      />
    </div>

    <!--  images clik hover effect  -->
    <div class="group overflow-hidden rounded-2xl mt-3">
      <img
        src="//picsum.photos/600/400"
        alt="image1"
        class="w-full h-56 object-cover transition duration-300 group-hover:scale-105"
      />
    </div>

    <!-- Group  --div ko hover + group effect add kiya  -->
    <div class="group">
      <h2 class="group-hover:text-blue-600">Product</h2>

      <h2 class="group-hover:text-red-400">Categories</h2>
    </div>

    <div
      class="group bg-grey-200 border-grey-400 rounded-xl p-6 hover:shadow-lg"
    >
      <h2
        class="text-xl font-bold text-grey-900 group-hover:text-blue-600 cursor-pointer"
      >
        Latest Laptop
      </h2>
    </div>

    <!-- Active concept -->

    <button
      class="bg-blue-600 hover:bg-red-700 active:bg-yellow-500 text-white-px-5 py-2 rounded-lg m3 cursor-pointer"
    >
      Click me!
    </button>

    <button
      class="bg-blue-600 hover:bg-red-700 disabled-bg-grey-500 text-white-px-5 py-2 rounded-lg m3 cursor-wait cursor-default"
    >
      ME TOO
    </button>

    <!-- focus -----   meaning is there Text filed when we click on that text filed that is focus effect-->

    <input
      type="text"
      class="border border-grey-400 focus:border-red-600 focus:ring-2 focus:ring-blue-400 rounded-lg px-4 py-2 mt-10 ml-10"
      placeholder="Enter your Name"
    />

    <input
      type="email"
      class="w-full border border-grey-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-400"
    />

    <hr />
    <!--  hover concept -->
    <button
      class="bg-blue-600 text-white px-9 py-2 rounded-lg mt-5 ml-5 hover:bg-green-600 hover:font-bold hover:text-red-400 hover:border-blue-500 border-2"
    >
      Save
    </button>
  </body>
</html>
