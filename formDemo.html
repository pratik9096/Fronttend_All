<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h2>Student Registration form</h2>
    <br><br>

    <form >
   <label for="First Name"> Firstname</label>
   <input type="text" name="firstName"
   id="" class=""
    placeholder="Enter Firstname" autocomplete="off">
   <br > <br>
  
   <label   for=" LastName">LastName</label>
   <input type="text"name="LastName" id="LastName" class="LastName" value="LastName" readonly>
  <br>  <br>
  <label for=" email">email</label>
  <input type="email" name="email"
  placeholder="Enter email" auto>
   <br> <br>
   <label for="password"> Enter password</label>
   <input type="password" name="password" 
   id=""  
   placeholder="ENter password">
   <br> <br>
    <label for="address">address</label>
    <textarea name="address" id="address" required rows="5" cols="20"></textarea>
    <br> <br>
    <label for="quantity">Set Quantity</label>
    <input type="number" name="number" id="" placeholder="Add Quantity" min="1"  max="5">
    <br> <br>  
    <label for="File"> File</label>
        <input type="file" name="file" id="" multiple>
    <br> <br>
    <label for="DOB">DOB</label>
    <input type="date" name="Date Of Birth" id="">
    <input type="datetime" name="" id="">
    <input type="datetime-local" name="" id="">
    <br> <br>
    <label for="Drop Down"></label>
    <br><br>
    <select name="State" id="State">
    <option value="">Select State</option>
    <option value="MH">Maharashtra</option>
    <option value="UP">Uttar Pradesh</option>
    <option value="Bihar">Bihar</option>
    <option value="Assam">Assam</option>  </select>
    <br><br>
    <label for="Skill"> Select Skills</label>
    <input type="search" name="search" id=""> <button>&num;</search></button>
    <br><br>
  <button style="margin-left: 40px;" type="button"> Register</button>
  
  <button  style="margin-left: 40px;" type="reset">reset</button>
  

    </form>
</body>
</html>
